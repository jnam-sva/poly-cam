<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>High Line — 3D Scan</title>

    <!-- Google Model Viewer -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            color: #222222;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #666666;
        }

        model-viewer {
            width: 100%;
            height: 80vh;
            background-color: #eeeeee;
        }

        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #888888;
        }

    </style>

</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>High Line — New York City</h1>
        <p>A 3D Exploration of Urban Space</p>
    </header>

    <!-- Polycam 3D Model -->
    <model-viewer
        src="./assets/highline.glb"
        alt="3D scan of the High Line in New York City"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        loading="eager">
    </model-viewer>

    <!-- Website Footer -->
    <footer>
        <p>3D Scanned with Polycam | New York City, 2026</p>
    </footer>

</body>

</html>
