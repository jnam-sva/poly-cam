<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Walk Above the City</title>

    <!-- Google Model Viewer -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 40px 30px 20px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            color: #222;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
            max-width: 650px;
            margin: 0 auto;
        }

        model-viewer {
            width: 100%;
            height: 75vh;
            background-color: #eeeeee;
        }
    </style>

</head>

<body>

    <!-- Title & Story -->
    <header>
        <h1>A Walk Above the City</h1>

        <p>
            The High Line offers a unique way to experience New York City,
            where gardens and urban landscapes come together.
            Walking along its elevated pathway, visitors can enjoy nature
            while surrounded by the city.
        </p>
    </header>

    <!-- Polycam 3D Model -->
    <model-viewer
        src="./assets/highline.glb"
        alt="3D scan of the High Line in New York City"
        camera-controls
        tone-mapping="neutral"
        shadow-intensity="1"
        camera-target="0m 0m -0.000001907m"
        camera-orbit="-5.446deg 79.37deg 135.3m"
        field-of-view="15.72deg"
        loading="eager">
    </model-viewer>

</body>

</html>
